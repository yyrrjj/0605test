<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #f0f2f5;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #1e293b;
        }
        p {
            color: #475569;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #2563eb;
            transform: scale(0.98);
        }
        .count {
            margin-top: 1.5rem;
            font-size: 1.2rem;
            font-weight: 500;
            color: #0f172a;
        }
        footer {
            margin-top: 1.8rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>✨ 你好呀</h1>
        <p>这是一个超级简单的网页<br>点击按钮试试看 👇</p>
        <button id="clickBtn">点我一下</button>
        <div class="count">点击次数: <span id="counter">0</span></div>
        <footer>开心就好 ✨</footer>
    </div>

    <script>
        let count = 0;
        const counterSpan = document.getElementById('counter');
        const btn = document.getElementById('clickBtn');
        
        btn.addEventListener('click', () => {
            count++;
            counterSpan.textContent = count;
        });
    </script>
</body>
</html>
